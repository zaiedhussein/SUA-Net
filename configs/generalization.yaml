base_config: train/busi.yaml
output_dir: /kaggle/working/cross_dataset_generalization
include_diagonal: false
strict_fold_count: true
mc_dropout_samples: 20

datasets:
  BUSI: /kaggle/input/datasets/joydhar/breast-cancer-ultrasound-dataset/Dataset_BUSI_with_GT
  BUSBRA: /kaggle/input/datasets/orvile/bus-bra-a-breast-ultrasound-dataset
  BUS-UCLM: /kaggle/input/datasets/orvile/bus-uclm-breast-ultrasound-dataset/BUS-UCLM Breast ultrasound lesion segmentation dataset/BUS-UCLM Breast ultrasound lesion segmentation dataset/BUS-UCLM

model_dirs:
  BUSI: /kaggle/working/sua_net_busi
  BUSBRA: /kaggle/working/sua_net_busbra
  BUS-UCLM: /kaggle/working/sua_net_bus_uclm

# These source-specific files are checked against checkpoint metadata.
source_configs:
  BUSI: train/busi.yaml
  BUSBRA: train/busbra.yaml
  BUS-UCLM: train/bus_uclm.yaml

# Within-dataset AUC means are loaded automatically from each summary.json.
# Explicit positive values here would override those files.
within_auc: {}
