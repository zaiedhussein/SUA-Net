name: Bug report
description: Report a reproducible software defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Problem
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction command
      description: Include the command and configuration file.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include Python, PyTorch, CUDA, GPU, operating system, and Git commit.
    validations:
      required: true
