[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suanet-bus"
version = "1.0.0"
description = "Reproducible SUA-Net experiments for breast ultrasound lesion classification"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Zaied Alhaj"}

]
keywords = ["medical imaging", "breast ultrasound", "deep learning", "attention", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "timm>=1.0,<2",
  "albumentations>=1.4,<3",
  "opencv-python-headless>=4.9",
  "numpy>=1.26,<3",
  "Pillow>=10",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "thop>=0.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "build>=1.2",
]

[project.scripts]
suanet-train = "suanet.cli.train:main"
suanet-train-suite = "suanet.cli.suite:main"
suanet-ablate = "suanet.cli.ablation:main"
suanet-generalize = "suanet.cli.generalization:main"
suanet-failure-cases = "suanet.cli.failure_cases:main"
suanet-audit = "suanet.cli.audit:main"
suanet-analyze = "suanet.cli.analysis:main"
suanet-profile = "suanet.cli.profile:main"
suanet-diversity = "suanet.cli.diversity:main"
suanet-study = "suanet.cli.study:main"
suanet-uncertainty-cases = "suanet.cli.uncertainty_cases:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
